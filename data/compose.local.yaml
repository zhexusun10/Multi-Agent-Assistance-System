# Used together with compose.yaml by scripts/local-data.ps1.
services:
  chroma:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    ports:
      - '127.0.0.1:8002:8000'
    environment:
      IS_PERSISTENT: 'TRUE'
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: 'FALSE'
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    restart: unless-stopped
  neo4j:
    restart: unless-stopped
  neo4j-sample:
    image: neo4j:5-community
    profiles: [sample]
    restart: unless-stopped
    ports:
      - '127.0.0.1:7475:7474'
      - '127.0.0.1:7688:7687'
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_sample_data:/data
    healthcheck:
      test: [CMD-SHELL, "cypher-shell --non-interactive 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 30s
volumes:
  chroma_data:
  neo4j_sample_data:
